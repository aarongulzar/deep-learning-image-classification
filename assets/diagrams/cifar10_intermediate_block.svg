<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">CIFAR-10 input-conditioned intermediate block</title>
  <desc id="desc">An input feature map enters several independent convolutional paths. A second branch spatially averages the input, passes the channel averages through a fully connected layer and softmax, and uses the resulting coefficients to form a weighted sum of the convolutional outputs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 19px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .detail { font: 400 16px Inter, "Segoe UI", Arial, sans-serif; fill: #334155; }
      .small { font: 600 15px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #475569; stroke-width: 2; rx: 12; }
      .primary { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; rx: 12; }
      .coefficient { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; rx: 12; }
      .combine { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; rx: 12; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" class="title">Input-conditioned intermediate block</text>

  <rect x="28" y="242" width="165" height="104" class="primary"/>
  <text x="110" y="282" text-anchor="middle" class="label">Input</text>
  <text x="110" y="310" text-anchor="middle" class="detail">feature map x</text>

  <text x="395" y="82" text-anchor="middle" class="small">Independent convolutional paths receive the same input</text>

  <path d="M193 294 H225 V130 H270" class="flow"/>
  <path d="M225 294 V265 H270" class="flow"/>
  <path d="M225 294 V400 H270" class="flow"/>

  <rect x="270" y="95" width="250" height="88" class="node"/>
  <text x="395" y="126" text-anchor="middle" class="label">Convolutional path 1</text>
  <text x="395" y="154" text-anchor="middle" class="detail">3×3 Conv → BatchNorm → ReLU</text>

  <rect x="270" y="220" width="250" height="88" class="node"/>
  <text x="395" y="251" text-anchor="middle" class="label">Convolutional path 2</text>
  <text x="395" y="279" text-anchor="middle" class="detail">3×3 Conv → BatchNorm → ReLU</text>

  <rect x="270" y="355" width="250" height="88" class="node"/>
  <text x="395" y="386" text-anchor="middle" class="label">Convolutional path n</text>
  <text x="395" y="414" text-anchor="middle" class="detail">3×3 Conv → BatchNorm → ReLU</text>

  <text x="395" y="334" text-anchor="middle" class="label">⋮</text>

  <path d="M520 139 H665 V244" class="flow"/>
  <path d="M520 264 H665" class="flow"/>
  <path d="M520 399 H665 V316" class="flow"/>

  <rect x="665" y="222" width="190" height="116" class="combine"/>
  <text x="760" y="262" text-anchor="middle" class="label">Weighted sum</text>
  <text x="760" y="291" text-anchor="middle" class="detail">path outputs ×</text>
  <text x="760" y="316" text-anchor="middle" class="detail">normalised coefficients</text>

  <path d="M855 280 H980" class="flow"/>
  <rect x="980" y="235" width="190" height="90" class="primary"/>
  <text x="1075" y="271" text-anchor="middle" class="label">Output</text>
  <text x="1075" y="299" text-anchor="middle" class="detail">feature map</text>

  <path d="M110 346 V526 H230" class="flow"/>
  <rect x="230" y="485" width="220" height="92" class="coefficient"/>
  <text x="340" y="518" text-anchor="middle" class="label">Spatial average</text>
  <text x="340" y="545" text-anchor="middle" class="detail">mean over H × W</text>
  <text x="340" y="566" text-anchor="middle" class="small">one value per input channel</text>

  <path d="M450 531 H510" class="flow"/>
  <rect x="510" y="485" width="180" height="92" class="coefficient"/>
  <text x="600" y="520" text-anchor="middle" class="label">Fully connected</text>
  <text x="600" y="548" text-anchor="middle" class="detail">path coefficients</text>

  <path d="M690 531 H750" class="flow"/>
  <rect x="750" y="485" width="180" height="92" class="coefficient"/>
  <text x="840" y="520" text-anchor="middle" class="label">Softmax</text>
  <text x="840" y="548" text-anchor="middle" class="detail">normalised weights</text>

  <path d="M840 485 V400 H760 V338" class="flow"/>
</svg>
